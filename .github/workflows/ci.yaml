name: ci

on:
  push:
    branches:
      - 'main'
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Version
        id: version
        run: |
          set -x
          echo "VERSION=$(python apps/version.py)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/g10f/wiki
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=pep440,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    if: false
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: g10f/deployment
          ref: main
          token: ${{ secrets.PAT }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3  # v2.8.1, pinned to a commit: it receives secrets
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host g10f-wiki
              ProxyCommand sh -c "aws ssm start-session --region eu-central-1 --target ${{ secrets.INSTANCE_ID }} --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
              User ubuntu

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # No --diff: the logs of a public repo are public, and a diff can show secrets (it once showed SECRET_KEY).
      - run: |
          pip install -r requirements.txt
          ansible-playbook deploy.yml -l g10f-wiki
        env:
          ANSIBLE_VAULT_IDENTITY_LIST: vault-password-file.sh
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
